<!DOCTYPE html> 
 
<html> 
 
<head> 
 
 <meta charset="utf-8"> 
 
 <title>My A-Frame World</title> 
 
 <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script> 
 
</head> 
 
<body> 
 
 <a-scene> 
 
   <a-box 
     position="0 1 -6" 
     color="#0097A7"> 
   </a-box> 
 
   <a-plane 
     position="0 0 -4" 
     rotation="-90 0 0" 
     width="10" 
     height="10" 
     color="#0E5158"> 
   </a-plane> 
 
   <a-sky color="#8EC4CA"></a-sky> 
 
 </a-scene> 
 
</body> 
 
</html>
