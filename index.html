<!DOCTYPE html> 
 
<html> 
 
<head> 
 
 <meta charset="utf-8"> 
 
 <title>My A-Frame World</title> 
 
 <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script> 
 <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
 
</head> 
 
<body> 
 
 <a-scene> 
 
   <a-box 
     position="0 1 -6" 
     color="#000000"
     height="15"
     width="5"> 
   </a-box> 
 
   <a-plane 
     position="0 -1 -4" 
     rotation="-90 0 0" 
     width="10" 
     height="10" 
     color="#0E5158"> 
   </a-plane> 
 
   <a-sky color="#0097A7"></a-sky> 
 
<a-entity 
 environment="preset: forest;
 groundColor: #1D261A;
 dressingScale: 40;
 lighting: point;
 skyType: gradient;
 skyColor: #FFF9C4;
 horizonColor: #607D8B;
 seed: 5;
 dressingColor: #3D4939;
 grid:none;">
</a-entity>

 </a-scene> 
 
</body> 
 
</html>
